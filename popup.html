<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Market Tracker</h1>
        <div class="header-actions">
          <button id="notifToggleBtn" type="button" class="ghost-btn">Pause Alerts</button>
          <button id="refreshBtn" type="button">Refresh</button>
        </div>
      </header>

      <nav class="tabs" aria-label="Market Tabs">
        <button class="tab-btn active" type="button" data-tab="india">India</button>
        <button class="tab-btn" type="button" data-tab="global">Global</button>
        <button class="tab-btn" type="button" data-tab="stocks">Stocks</button>
      </nav>

      <section class="tab-panel active" id="tab-india">
        <section class="timer-card">
          <div class="timer-title">Market Timers (IST)</div>
          <div class="timer-row">
            <span>Phase</span>
            <span id="marketPhase">--</span>
          </div>
          <div class="timer-row">
            <span id="nextEventLabel">Next</span>
            <span id="nextEventTimer">--</span>
          </div>
        </section>

        <section class="cards">
          <article class="card" data-key="nifty">
            <div class="card-title">Nifty 50</div>
            <div class="price" id="niftyPrice">--</div>
            <div class="delta" id="niftyDelta">--</div>
          </article>

          <article class="card" data-key="bankNifty">
            <div class="card-title">Bank Nifty</div>
            <div class="price" id="bankNiftyPrice">--</div>
            <div class="delta" id="bankNiftyDelta">--</div>
          </article>

          <article class="card" data-key="giftNifty">
            <div class="card-title">Gift Nifty</div>
            <div class="price" id="giftNiftyPrice">--</div>
            <div class="delta" id="giftNiftyDelta">--</div>
          </article>

          <article class="card" data-key="sensex">
            <div class="card-title">Sensex</div>
            <div class="price" id="sensexPrice">--</div>
            <div class="delta" id="sensexDelta">--</div>
          </article>
        </section>
      </section>

      <section class="tab-panel" id="tab-global">
        <section class="cards">
          <article class="card" data-key="sp500">
            <div class="card-title">S&P 500</div>
            <div class="price" id="sp500Price">--</div>
            <div class="delta" id="sp500Delta">--</div>
          </article>

          <article class="card" data-key="dowJones">
            <div class="card-title">Dow Jones</div>
            <div class="price" id="dowJonesPrice">--</div>
            <div class="delta" id="dowJonesDelta">--</div>
          </article>

          <article class="card" data-key="nasdaq">
            <div class="card-title">Nasdaq 100</div>
            <div class="price" id="nasdaqPrice">--</div>
            <div class="delta" id="nasdaqDelta">--</div>
          </article>

          <article class="card" data-key="ftse100">
            <div class="card-title">FTSE 100</div>
            <div class="price" id="ftse100Price">--</div>
            <div class="delta" id="ftse100Delta">--</div>
          </article>

          <article class="card" data-key="nikkei225">
            <div class="card-title">Nikkei 225</div>
            <div class="price" id="nikkei225Price">--</div>
            <div class="delta" id="nikkei225Delta">--</div>
          </article>
        </section>
      </section>

      <section class="tab-panel" id="tab-stocks">
        <nav class="inner-tabs" aria-label="Stocks Tabs">
          <button class="inner-tab-btn active" type="button" data-inner-tab="tracker">Main Stock Tracker</button>
          <button class="inner-tab-btn" type="button" data-inner-tab="alerts">Alerts</button>
        </nav>

        <section class="inner-tab-panel active" id="inner-tab-tracker">
          <section class="stock-board">
            <div class="stock-board-head">
              <div class="stock-board-title">Stock Tracker</div>
              <select id="stockSort" class="stock-sort">
                <option value="alpha">Alpha</option>
                <option value="changeAsc" selected>Change % Low-High</option>
                <option value="changeDesc">Change % High-Low</option>
              </select>
            </div>
            <div class="stock-search-shell">
              <input id="stockSearchInput" class="stock-search-input" type="search" placeholder="Add stock by name or symbol" autocomplete="off" spellcheck="false" />
              <div id="stockSearchResults" class="stock-search-results" hidden></div>
            </div>
            <div id="stocksList"></div>
          </section>
        </section>

        <section class="inner-tab-panel" id="inner-tab-alerts">
          <section class="alerts-board">
            <div class="alerts-board-head">
              <div class="stock-board-title">Price Alerts</div>
              <button id="syncApiAlertsBtn" type="button" class="alert-sync-btn">Sync API</button>
            </div>
            <div class="alert-form-grid">
              <div class="stock-search-shell">
                <input id="alertStockSearchInput" class="stock-search-input" type="search" placeholder="Search stock for alert" autocomplete="off" spellcheck="false" />
                <div id="alertSearchResults" class="stock-search-results" hidden></div>
              </div>
              <input id="alertThresholdInput" class="alert-threshold-input" type="number" min="0" step="0.01" placeholder="Target price" />
              <button id="addAlertBtn" type="button" class="alert-add-btn">Add Alert</button>
            </div>
            <div id="priceAlertsList"></div>
          </section>
        </section>
      </section>

      <footer class="footer">
        <span id="statusText">Loading...</span>
      </footer>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
